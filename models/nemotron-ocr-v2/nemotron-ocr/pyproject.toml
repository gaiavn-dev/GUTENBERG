[project]
name = "nemotron-ocr"
version = "1.0.0"
description = "Nemoton OCR"
authors = [{ name = "NVIDIA Nemotron" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface_hub>=0.20.0",
    "numpy>=1.26.0",
    "pillow>=12.0.0",
    "shapely>=2.1.2,<3",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
]

[project.urls]
Homepage = "https://nvidia.com/"

[dependency-groups]
dev = [
    "ipython>=9.6.0",
    "pre-commit>=3.8.0,<4",
    "pytest>=8.3.2,<9",
    "pytest-cov>=5.0.0,<6",
]

[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/nemotron_ocr_cpp/*.so"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/nemotron_ocr",
    "src/nemotron_ocr_cpp",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
dependencies = ["setuptools>=68", "torch>=2.0", "ninja"]

[tool.hatch.build.targets.sdist]
include = [
    "src/**",
    "cpp/**",
    "scripts/**",
    "hatch_build.py",
    "pyproject.toml",
    "README.md",
    "LICENSE*",
]
